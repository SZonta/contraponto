<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680"><rect width="1100" height="680" fill="#1c1b19"/><style>text{font-family:Segoe UI,sans-serif;fill:#ece7df} .muted{fill:#b2aa9d}.small{font-size:13px}.body{font-size:16px}.title{font-size:22px;font-weight:600}.coral{fill:#d97757}.green{fill:#6fb59a}</style><rect x="20" y="20" width="1060" height="58" rx="10" fill="#24221f" stroke="#83786a"/><text x="42" y="56" class="title">Contraponto</text><text x="225" y="54" class="body muted">Projeto de exemplo / Cena inicial</text><rect x="792" y="34" width="266" height="30" rx="6" fill="#493e24"/><text x="810" y="54" class="small">PROTÓTIPO · NÃO IMPLEMENTADO</text><text x="42" y="110" class="small muted">Modo Foco opcional · navegação recolhida</text><rect x="28" y="133" width="708" height="408" rx="12" fill="#24221f" stroke="#3a3631"/><text x="52" y="171" class="title">Uma tarefa por vez</text><rect x="268" y="201" width="442" height="66" rx="10" fill="#2e2b27"/><text x="287" y="229" class="body">Prepare a cena e uma referência visual.</text><text x="287" y="250" class="small muted">Pedido de exemplo</text><text x="54" y="304" class="body coral">● Claude</text><text x="54" y="333" class="body">O comportamento está pronto.</text><text x="54" y="358" class="body">Passei a referência visual ao Codex.</text><rect x="52" y="388" width="658" height="112" rx="9" fill="#1c1b19" stroke="#83786a"/><text x="72" y="419" class="body green">● Codex</text><text x="72" y="449" class="body">Aguardando uma decisão para continuar.</text><text x="72" y="476" class="small muted">Detalhes e histórico ficam disponíveis sob demanda.</text><rect x="757" y="133" width="315" height="408" rx="12" fill="#24221f" stroke="#83786a"/><text x="779" y="171" class="title">Agora</text><text x="779" y="207" class="body green">Codex · precisa de você</text><text x="779" y="244" class="small muted">Próxima ação</text><text x="779" y="270" class="body">Confira a criação da referência.</text><rect x="779" y="294" width="270" height="43" rx="7" fill="#6fb59a"/><text x="846" y="321" font-size="15" style="fill:#1c1b19;font-weight:600">Ver pedido</text><text x="779" y="377" class="small muted">Equipe</text><text x="779" y="408" class="body coral">Claude · código concluído</text><text x="779" y="440" class="body green">Codex · referência visual</text><text x="779" y="499" class="small muted">Cotas e modelos no cabeçalho da equipe</text><rect x="28" y="561" width="1044" height="92" rx="10" fill="#24221f" stroke="#83786a"/><text x="50" y="595" class="body muted">Qual é a próxima ação?</text><text x="50" y="628" class="small muted">Automático ▾      Anexar       Opções</text><rect x="918" y="581" width="132" height="52" rx="7" fill="#6fb59a"/><text x="956" y="614" font-size="16" style="fill:#1c1b19;font-weight:600">Enviar</text></svg>